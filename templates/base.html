<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="{{ url_for('static', filename='pulse.svg') }}" type="image/svg+xml">
        <title>{{title if title else "MISSING TITLE"}}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar navbar-expand-md border-bottom">
            <div class="container-fluid">
                <a href="{{ url_for('pages.monitors') }}" class="navbar-brand d-flex align-items-center gap-2">
                    <img src="{{ url_for('static', filename='pulse.svg') }}" alt="" width="22" height="22">
                    ChatPulse
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <div class="navbar-nav">
                        <a class="nav-link" href="{{ url_for('pages.monitors') }}">Monitors</a>
                        <a class="nav-link" href="{{ url_for('pages.livechat') }}">Live Chat</a>
                        <a class="nav-link" href="{{ url_for('pages.sessions') }}">Sessions</a>
                    </div>
                </div>
            </div>
        </nav>
        
        <div class="container py-4">
            {% block content %}{% endblock %}
        </div>

        <footer class="mt-auto border-top py-3">
            <div class="container d-flex flex-wrap justify-content-between gap-2 small text-body-secondary">
                <span>ChatPulse | Python course project 2026</span>
                <span>Made by Kevin Borup</span>
                <a href="https://github.com/KBorupH/ChatPulse" class="link-secondary">Source on GitHub</a>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
