{% extends "base.html" %}
{% block content %}
    <h1>Monitors</h1>
    <p>One Monitor per channel. </p>
    <div>
        <h2>Start a monitor</h2>
        <form method="post" action="{{ url_for('pages.start_monitor') }}">
            <label class="form-label">Platform
                <select name="platform" class="form-select">
                    <option value="twitch">Twitch</option>
                </select>
            </label>

            <label class="form-label">Channel
                <input name="channel_login" type="text" class="form-control" placeholder="Channel name" required/>
            </label>

            <button type="submit" class="btn btn-primary" >Start Monitor</button>
        </form>
    </div>
    <h2>Running</h2>
    {% if not monitors %}
    <p class="text-body-secondary">No monitors running.</p>
    {% endif %}
    {% for m in monitors %}
    <div class="card-body">
        <h3>#{{ m.channel_login }}</h3>
        <span class="badge text-bg-secondary">{{ m.platform_name.title() }}</span>
        <span class="badge {{ 'text-bg-success' if m.status == 'running' else 'text-bg-danger' }}">
            {{ m.status.title() }}
        </span>
        <form method="post" action="{{ url_for('pages.stop_monitor', channel_id=m.channel_id) }}">
            <button type="submit" class="btn btn-outline-danger">Stop</button>
        </form>
    </div>
    {% endfor %}
{% endblock %}
