{% extends "base.html" %}
{% block styles%}
<link rel="stylesheet" href="{{ url_for('static', filename='css/live_chat.css') }}">
{% endblock%}
{% block content %}
    <h1>Live Chat</h1>
    {% if not monitors %}
    <p class="text-body-secondary">No monitors running. <a href="{{ url_for('pages.monitors') }}">Start one</a>.</p>
    {% endif %}

    <div class="row g-3">
        {% for m in monitors %}
        <div class="col-12 col-lg-6">
            <div class="card chat-pane" data-channel-id='{{ m.channel_id }}'>
                <header class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">#{{ m.channel_login }}</h6>
                    <span class="badge"  style="background-color: {{ m.platform_color }}">{{ m.platform_name.title() }}</span>
                </header>
                <ol class="messages list-unstyled card-body overflow-auto mb-0" style="height: 60vh"></ol>
            </div>
        </div>
        {% endfor %}
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/live_chat.js') }}"></script>
{% endblock %}
